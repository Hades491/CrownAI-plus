name: Pulse Poller

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write .env from secret
        run: echo "YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}" > .env

      - name: Initialize DB if missing
        run: python scripts/db.py

      - name: Reseed (discover newly trending videos)
        run: python scripts/seed.py --region IN

      - name: Poll current stats
        run: python scripts/poller.py

      - name: Compute momentum + leaderboards
        run: python scripts/momentum.py

      - name: Commit updated database back to repo
        run: |
          git config user.name "pulse-bot"
          git config user.email "pulse-bot@users.noreply.github.com"
          git add db/pulse.db
          git diff --staged --quiet || git commit -m "Automated snapshot: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
